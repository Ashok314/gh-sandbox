name: Update JSON

on:
  workflow_dispatch:
  # schedule:
   #  - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update JSON
        run: |
          mkdir -p public/data
          node - <<'NODE'
          const fs = require("fs");
          const path = "public/data/ping.json";
          const data = {
            updatedAt: new Date().toISOString(),
            runNumber: Number(process.env.GITHUB_RUN_NUMBER || 0),
          };
          fs.writeFileSync(path, `${JSON.stringify(data, null, 2)}\n`);
          NODE

      - name: Commit JSON if changed
        run: |
          if git diff --quiet -- public/data/ping.json; then
            echo "No data changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/ping.json
          git commit -m "Update sandbox JSON"
          git push
